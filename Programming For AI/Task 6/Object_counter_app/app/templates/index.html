<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Detection App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Animal Detection</h1>
        <p>Upload an image to detect animals</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <input type="file" name="file" id="file-input">
                <label for="file-input" class="file-label">Choose File</label>
            </div>
            <button type="submit" class="btn">Detect Animals</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Detection Result:</h2>
            <p>{{ result }}</p>
            {% if filename %}
            <div class="image-container">
                <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Detected Image">
                <div class="glow-effect"></div>
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>

    <footer>
        Made By Kaif 💖 using Flask & YOLOv8
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness | AI Companion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="main-card">
        <div class="chat-header">
            <div class="bot-info">
                <div class="status-dot"></div>
                <div>
                    <h1>Kaif's AI</h1>
                    <p>Mental Wellness AI</p>
                </div>
            </div>
            <div class="header-actions">
                <i class="fas fa-ellipsis-h"></i>
            </div>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="time-stamp">Today</div>
            
            <div class="message bot-message">
                Hello. I'm here to provide a safe, judgment-free space for you. How are you feeling?
            </div>
            
            <div id="typing-indicator" class="message bot-message typing" style="display: none;">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()" class="send-btn">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
